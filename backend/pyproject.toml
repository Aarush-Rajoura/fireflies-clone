[project]
name = "fireflies-clone-backend"
version = "0.1.0"
description = "Backend API for the Fireflies.ai clone"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "python-multipart",
    "httpx",
    "reportlab",
    "slowapi",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx2>=2.13.1",
    "types-reportlab>=5.0.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    # SQLite cannot reflect expression-based indexes; documented in docs/schema.md.
    "ignore:Skipped unsupported reflection of expression-based index:sqlalchemy.exc.SAWarning",
    "ignore:autogenerate skipping metadata-specified expression-based index:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
